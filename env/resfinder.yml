name: resfinder_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - git          
  - blast        
  - kma
  - setuptools<70.0.0  
  - pip:
    # Compatible with glibc 2.17; avoid pandas source builds and Biopython conflicts.
    - resfinder==4.6.0
    - MobileElementFinder==1.1.2
    - cgecore==1.5.6
    - biopython==1.80
    - pandas==2.2.3
    - numpy==1.26.4
